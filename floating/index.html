<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浮生 · FLOATING LIVES — 生态瓶</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="topbar">
    <div class="brand">
      <h1>浮生</h1>
      <div class="brand-sub">FLOATING LIVES · 一瓶之中，万物自生</div>
    </div>
    <div class="seed-box">
      <label for="seedInput">种子</label>
      <div class="seed-row">
        <input id="seedInput" type="text" spellcheck="false" placeholder="种子…">
        <button id="unrollBtn">开 瓶</button>
      </div>
    </div>
  </header>

  <aside class="stats">
    <div class="stat"><b id="statFish">0</b><span>游鱼</span></div>
    <div class="stat"><b id="statPlankton">0</b><span>浮游</span></div>
    <div class="stat"><b id="statPlant">0</b><span>水草</span></div>
  </aside>

  <nav class="toolbar">
    <div class="tool-group">
      <label class="tool-label">光照 <b id="lightVal"></b></label>
      <input type="range" id="lightRange" min="0" max="1" step="0.01">
    </div>
    <span class="hint-inline">在瓶中拖动，扰动水流</span>
  </nav>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
