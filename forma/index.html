<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>形境 · FORMA — L-系统植物</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="topbar">
    <div class="brand">
      <h1>形境</h1>
      <div class="brand-sub">FORMA · 种子为壤，植物自生</div>
    </div>
    <div class="seed-box">
      <label for="seedInput">种子</label>
      <div class="seed-row">
        <input id="seedInput" type="text" spellcheck="false" placeholder="种子…">
        <button id="plantBtn">栽 植</button>
      </div>
    </div>
  </header>

  <nav class="toolbar">
    <div class="tool-group">
      <label class="tool-label">植物</label>
      <select id="typeSel" title="植物类型"></select>
    </div>
    <div class="tool-group">
      <label class="tool-label">色系</label>
      <select id="paletteSel" title="色系"></select>
    </div>
    <div class="tool-group">
      <label class="tool-label">风 <b id="windVal"></b></label>
      <input type="range" id="windRange" min="0" max="1" step="0.05">
    </div>
  </nav>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
